# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR

  # Miscellaneous toolchain controls directly passed to the tools
  misc:
    - for-compiler: AC6 # change to -gdwarf-4 for debugging using uVision
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5

  # List the packs that define the device and/or board.
  packs:
    - pack: Keil::STM32U5xx_DFP
    - pack: ARM::CMSIS
    - pack: Keil::B-U585I-IOT02A_BSP
    - pack: SEGGER::RTT@8.58.0

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: STM32U585AIIx
      target-set:
        - set:
          images:
            - project-context: CubeMX.Debug
      device: STM32U585AIIx
      board: B-U585I-IOT02A:Rev.C
      variables:
        - Board-Layer: $SolutionDir()$/Board/B-U585I-IOT02A/Board.clayer.yml
          copied-from: ${CMSIS_PACK_ROOT}/Keil/B-U585I-IOT02A_BSP/3.0.0/Layers/Default/
  build-types:
    - type: Debug
      debug: on
      optimize: none

    - type: Release
      debug: off
      optimize: balanced

  # List related projects.
  projects:
    - project: CubeMX.cproject.yml
  compiler: AC6
