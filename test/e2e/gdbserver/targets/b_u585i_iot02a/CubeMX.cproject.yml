# A project translates into one executable or library.
project:

  # The selected board layer supplies the CMSIS core, CubeMX configuration,
  # startup code, linker regions, and board-level driver configuration.
  layers:
    - layer: $Board-Layer$
      type: Board

  components:
    - component: SEGGER:RTT

  # The common firmware core includes this target's platform-service interface.
  add-path:
    - ..
    - Source

  groups:
    - group: Source
      files:
        - file: ../gdbserver_test_firmware.c
        - file: Source/gdbserver_test_firmware_platform.c

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
